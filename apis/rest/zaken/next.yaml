openapi: 3.1.0
info:
  title: MijnZaken
  description: |
    De **MijnZaken API** standaardiseert hoe portalen lopende en historische zaken (aanvragen, meldingen) van burgers kunnen raadplegen en tonen.

    ## De burger komt uit het token

    De API kent geen `klantId`- of BSN-parameter. De bron leidt de burger af uit het
    toegangstoken (zie [`patterns/federated-auth`](../../../patterns/federated-auth/next.yaml))
    en geeft alleen zaken terug waarin die burger betrokkene is. Een zaak van iemand anders
    opvragen met een geldig eigen token geeft `403`.

    ## Data, geen presentatie

    De API levert data; het portaal formatteert. Datums zijn ISO 8601, bestandsgroottes zijn
    bytes, en er staan geen kant-en-klare teksten als "nog 2 dagen" of "2000 kB" in.

    ## Conformance

    Het gedrag (overzicht en detail kloppen met elkaar, autorisatie per burger) wordt getest
    met het aansluitprofiel [`aansluitprofielen/mijnzaken/mijnzaken-next.arazzo.yaml`](../../../aansluitprofielen/mijnzaken/mijnzaken-next.arazzo.yaml).
  version: next
  contact:
    name: VNG Realisatie
    url: https://github.com/VNG-Realisatie/vng-api-lab
    email: standaarden.ondersteuning@vng.nl
  license:
    name: EUPL-1.2
    url: https://opensource.org/licenses/EUPL-1.2

servers:
  - url: https://api.example.nl/v1
    description: Productie

tags:
  - name: Zaken
    description: Raadpleeg zaken en details van lopende dossiers.

security:
  - FederatedOAuth2: [zaken:lezen]

paths:
  /zaken:
    get:
      operationId: listZaken
      summary: Zaken van de ingelogde burger
      description: |
        Geeft een gepagineerde lijst van zaken waarin de burger uit het token betrokkene is,
        als samenvattingen. Nieuwste aanvraag eerst.
