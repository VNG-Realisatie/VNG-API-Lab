        - Zaken
      parameters:
        - name: status
          in: query
          description: Alleen open of alleen gesloten zaken.
          schema:
            $ref: "#/components/schemas/ZaakStatus"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Succesvol
          headers:
            API-Version:
              $ref: "#/components/headers/API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZaakSamenvattingLijst"
              example:
                count: 10
                next: null
                previous: null
                results:
