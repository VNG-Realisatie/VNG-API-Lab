    BrondatumArchiefprocedure:
      type: object
      description: Specificatie voor het bepalen van de brondatum voor de start van de Archiefactietermijn (=brondatum) van het zaakdossier.
      properties:
        afleidingswijze:
          allOf:
            - $ref: '#/components/schemas/AfleidingswijzeEnum'
          title: Afleidingswijze brondatum
          description: "Wijze van bepalen van de brondatum.\n\nUitleg bij mogelijke waarden:\n\n* `afgehandeld` - (Afgehandeld) De termijn start op de datum waarop de zaak is afgehandeld (ZAAK.Einddatum in het RGBZ).\n* `ander_datumkenmerk` - (Ander datumkenmerk) De termijn start op de datum die is vastgelegd in een ander datumveld dan de datumvelden waarop de overige waarden (van deze attribuutsoort) betrekking hebben. `Objecttype`, `Registratie` en `Datumkenmerk` zijn niet leeg.\n* `eigenschap` - (Eigenschap) De termijn start op de datum die vermeld is in een zaaktype-specifieke eigenschap (zijnde een `datumveld`). `ResultaatType.ZaakType` heeft een `Eigenschap`; `Objecttype`, en `Datumkenmerk` zijn niet leeg.\n* `gerelateerde_zaak` - (Gerelateerde zaak) De termijn start op de datum waarop de gerelateerde zaak is afgehandeld (`ZAAK.Einddatum` of `ZAAK.Gerelateerde_zaak.Einddatum` in het RGBZ). `ResultaatType.ZaakType` heeft gerelateerd `ZaakType`\n* `hoofdzaak` - (Hoofdzaak) De termijn start op de datum waarop de gerelateerde zaak is afgehandeld, waarvan de zaak een deelzaak is (`ZAAK.Einddatum` van de hoofdzaak in het RGBZ). ResultaatType.ZaakType is deelzaaktype van ZaakType.\n* `ingangsdatum_besluit` - (Ingangsdatum besluit) De termijn start op de datum waarop het besluit van kracht wordt (`BESLUIT.Ingangsdatum` in het RGBZ).\tResultaatType.ZaakType heeft relevant BesluitType\n* `termijn` - (Termijn) De termijn start een vast aantal jaren na de datum waarop de zaak is afgehandeld (`ZAAK.Einddatum` in het RGBZ).\n* `vervaldatum_besluit` - (Vervaldatum besluit) De termijn start op de dag na de datum waarop het besluit vervalt (`BESLUIT.Vervaldatum` in het RGBZ). ResultaatType.ZaakType heeft relevant BesluitType\n* `zaakobject` - (Zaakobject) De termijn start op de einddatum geldigheid van het zaakobject waarop de zaak betrekking heeft (bijvoorbeeld de overlijdendatum van een Persoon). M.b.v. de attribuutsoort `Objecttype` wordt vastgelegd om welke zaakobjecttype het gaat; m.b.v. de attribuutsoort `Datumkenmerk` wordt vastgelegd welke datum-attribuutsoort van het zaakobjecttype het betreft."
        datumkenmerk:
          type: string
          description: Naam van de attribuutsoort van het procesobject dat bepalend is voor het einde van de procestermijn.
          title: datumkenmerk
          maxLength: 80
        einddatumBekend:
          type: boolean
          description: Indicatie dat de einddatum van het procesobject gedurende de uitvoering van de zaak bekend moet worden. Indien deze nog niet bekend is en deze waarde staat op `true`, dan kan de zaak (nog) niet afgesloten worden.
          title: einddatum bekend
        objecttype:
          description: |-
            Het soort object in de registratie dat het procesobject representeert.

            Uitleg bij mogelijke waarden:

            * `adres` - Adres
            * `besluit` - Besluit
            * `buurt` - Buurt
            * `enkelvoudig_document` - Enkelvoudig document
            * `gemeente` - Gemeente
            * `gemeentelijke_openbare_ruimte` - Gemeentelijke openbare ruimte
            * `huishouden` - Huishouden
            * `inrichtingselement` - Inrichtingselement
            * `kadastrale_onroerende_zaak` - Kadastrale onroerende zaak
            * `kunstwerkdeel` - Kunstwerkdeel
            * `maatschappelijke_activiteit` - Maatschappelijke activiteit
            * `medewerker` - Medewerker
            * `natuurlijk_persoon` - Natuurlijk persoon
            * `niet_natuurlijk_persoon` - Niet-natuurlijk persoon
            * `openbare_ruimte` - Openbare ruimte
            * `organisatorische_eenheid` - Organisatorische eenheid
            * `pand` - Pand
            * `spoorbaandeel` - Spoorbaandeel
            * `status` - Status
            * `terreindeel` - Terreindeel
            * `terrein_gebouwd_object` - Terrein gebouwd object
            * `vestiging` - Vestiging
            * `waterdeel` - Waterdeel
            * `wegdeel` - Wegdeel
            * `wijk` - Wijk
            * `woonplaats` - Woonplaats
            * `woz_deelobject` - Woz deel object
            * `woz_object` - Woz object
            * `woz_waarde` - Woz waarde
            * `zakelijk_recht` - Zakelijk recht
            * `overige` - Overige
          title: objecttype
          oneOf:
            - $ref: '#/components/schemas/ObjecttypeEnum'
            - $ref: '#/components/schemas/BlankEnum'
        registratie:
          type: string
          description: De naam van de registratie waarvan het procesobject deel uit maakt.
          title: registratie
          maxLength: 80
        procestermijn:
          type: string
          nullable: true
          title: Brondatum procestermijn
          description: De periode dat het zaakdossier na afronding van de zaak actief gebruikt en/of geraadpleegd wordt ter ondersteuning van de taakuitoefening van de organisatie. Enkel relevant indien de afleidingswijze 'termijn' is.
          format: duration
      required:
        - afleidingswijze
      nullable: true
