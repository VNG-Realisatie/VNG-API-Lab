          type: string
          example: '2015-01-02'
        registratiedatum__gt:
          title: Registratiedatum groter dan
          type: string
          example: '2014-01-02'
        registratiedatum__lt:
          title: Registratiedatum kleiner dan
          type: string
          example: '2016-01-02'
        einddatum:
