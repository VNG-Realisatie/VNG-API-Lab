          type: string
          example: '2017-01-02'
        startdatum__gt:
          title: Startdatum groter dan
          type: string
          example: '2018-01-02'
        startdatum__gte:
          title: Startdatum groter dan of gelijk
          type: string
          example: '2016-01-02'
        startdatum__lt:
          title: Startdatum kleiner dan
          type: string
          example: '2018-01-02'
        startdatum__lte:
          title: Startdatum kleiner dan of gelijk
          type: string
          example: '2018-01-02'
        registratiedatum:
