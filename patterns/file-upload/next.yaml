# Herkomst: praktijkpatroon (two-step upload met pre-signed URL); geen
# onderliggend architectuurbesluit. Zie ../../architecture/adr/README.md
title: File Upload
description: |
  Beschrijft het API-gedrag, de foutafhandeling en de (HTTP) OpenAPI request/response contracten voor het two-step (pre-signed URL) uploadproces.

  **Hoe werkt het voor de ontwikkelaar/gebruiker?**
  1. De client doet een `POST` naar een upload-sessie endpoint (vaak `.../upload-sessie`) met de benodigde bestand-metadata.
  2. Als dit slaagt (201), krijgt de client in het antwoord een tijdelijke, unieke `uploadUrl` (zoals een pre-signed S3 URL) terug om het ruwe bestand heen te sturen (meestal met `PUT`). Het antwoord bevat ook meteen een `bestand` object: de stabiele API-representatie van het aangemaakte bestands-record, meestal met status `uploadInAfwachting`.
  3. Na de `PUT` naar de opslaglaag gebruikt de client de `bestand.url` uit stap 2 om het bestand opnieuw op te vragen. Zo kan de gebruiker na de upload zien welk bestand is geregistreerd, inclusief naam, omvang, content type en status. Zodra de backend de upload heeft bevestigd, verandert de status naar `beschikbaar`.
  4. **Meerdere bestanden?** Wil de client 5 bestanden uploaden, dan roept hij deze `POST` operatie 5 keer aan. Batching voor bulk uploads naar cloud-storage verhoogt de complexiteit voor de proxy, vandaar dat single-file requests de voorkeur hebben in de API.
  5. **Fouten (Errors)?**
     - Bestandsgrootte groter dan toegestaan voor de server/tenant? Resultaat `413 Payload Too Large`.
     - Ontbrekende metadata of foute bestandsnaamextensie? Resultaat `400 Bad Request` (of 422).
     - Verlopen pre-signed URL (na stap 2)? Dan antwoordt de opslaglaag met een `403 Forbidden` tijdens de PUT. De client moet dan een nieuwe upload sessie starten in stap 1.
     - Upload niet afgerond voordat de pre-signed URL verloopt? Dan blijft het bestands-record raadpleegbaar via `bestand.url`, maar krijgt het status `verlopen` of wordt het door de API verwijderd volgens de bewaartermijn van de implementatie.

requestBodies:
  UploadSessieAanvraag:
    description: Het verzoek om een nieuwe upload-sessie te starten voor één bestand. Voor meerdere bestanden moet dit proces iteratief worden herhaald door de client.
    required: true
    content:
      application/json:
        schema:
          $ref: "../../schemas/file-upload/next.json#/$defs/FileMetadata"

responses:
  UploadSessieAangemaakt:
    description: De upload sessie is succesvol geregistreerd. De client kan nu het fysieke bestand overdragen naar de bijgeleverde URL en het aangemaakte bestands-record raadplegen via de meegeleverde `bestand.url`.
    content:
      application/json:
        schema:
          $ref: "../../schemas/file-upload/next.json#/$defs/FileUploadInformatie"

  BestandOpgevraagd:
    description: Het bestands-record is succesvol opgehaald. Gebruik deze response voor endpoints zoals `GET /bestanden/{fileId}` zodat de client na de upload kan zien welk bestand is geregistreerd en wat de status is.
    content:
      application/json:
        schema:
          $ref: "../../schemas/file-upload/next.json#/$defs/Bestand"

  # Deze error wordt specifiek gedefinieerd voor de upload-route omdat die uniek is voor grote uploads.
  PayloadTooLarge:
    description: De opgegeven bestandsomvang overschrijdt de maximale grootte (limiet) die voor deze resource is ingesteld.
    content:
      application/problem+json:
        schema:
          $ref: "../../schemas/fout/v0.0.1.json#/$defs/Fout"
